<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#050505"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#grid)"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#4f46e5" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="subtitleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="400" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#titleGradient)" text-anchor="middle" letter-spacing="-0.02em">IPO Tracker</text>
  <text x="400" y="305" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="url(#subtitleGradient)" text-anchor="middle" font-weight="400">IPO Tracking & Analysis Tool</text>
  <text x="400" y="355" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="url(#techGradient)" text-anchor="middle">React + APIs + Charts</text>
  <rect x="320" y="400" width="160" height="4" rx="2" fill="url(#techGradient)" opacity="0.3"/>
  <circle cx="400" cy="450" r="65" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="12,8" opacity="0.4"/>
  <circle cx="400" cy="450" r="45" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.3"/>
  <text x="400" y="465" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle" font-weight="500">Project Preview</text>
</svg>